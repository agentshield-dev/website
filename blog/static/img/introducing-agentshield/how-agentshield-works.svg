<svg xmlns="http://www.w3.org/2000/svg" width="760" height="624" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 624" role="img" aria-label="One graph, every change checked, every fix approved by a person" font-size="13"><rect width="760" height="624" fill="#ffffff"/><defs><marker id="how-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c3c3ba"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1a1a1a">One graph, every change checked, every fix approved by a person</text><text x="24" y="48" font-size="11.5" fill="#5f5f5a">How agentshield finds lateral-movement paths and closes them</text><g><rect x="24" y="88" width="228" height="512" rx="8" fill="#f0f0ed" stroke="#c3c3ba" stroke-width="1.25"></rect><text x="40" y="112" font-weight="600" fill="#1a1a1a">Your cluster</text></g><g><rect x="40" y="128" width="196" height="56" rx="8" fill="none" stroke="#c3c3ba" stroke-width="1"></rect><text x="52" y="152" font-weight="600" fill="#1a1a1a">Kubernetes</text><text x="52" y="168" font-size="11.5" fill="#5f5f5a">workloads, RBAC, policies</text></g><g><rect x="40" y="228" width="196" height="56" rx="8" fill="none" stroke="#c3c3ba" stroke-width="1"></rect><text x="52" y="252" font-weight="600" fill="#1a1a1a">Istio ambient</text><text x="52" y="268" font-size="11.5" fill="#5f5f5a">mTLS and authorization</text></g><g><rect x="40" y="328" width="196" height="56" rx="8" fill="none" stroke="#c3c3ba" stroke-width="1"></rect><text x="52" y="352" font-weight="600" fill="#1a1a1a">Cilium</text><text x="52" y="368" font-size="11.5" fill="#5f5f5a">network policies</text></g><g><rect x="40" y="428" width="196" height="56" rx="8" fill="none" stroke="#c3c3ba" stroke-width="1"></rect><text x="52" y="452" font-weight="600" fill="#1a1a1a">agentgateway</text><text x="52" y="468" font-size="11.5" fill="#5f5f5a">Gateway API routes</text></g><g><rect x="40" y="528" width="196" height="56" rx="8" fill="none" stroke="#c3c3ba" stroke-width="1"></rect><text x="52" y="552" font-weight="600" fill="#1a1a1a">Waypoint access logs</text><text x="52" y="568" font-size="11.5" fill="#5f5f5a">who actually talks to whom</text></g><g><rect x="268" y="88" width="468" height="512" rx="8" fill="none" stroke="#c3c3ba" stroke-width="1.25"></rect><path d="M48.3 0.0 L45.9 0.3 L43.7 1.0 L41.7 2.1 L40.1 3.4 L38.5 5.0 L37.4 6.8 L35.6 11.2 L34.2 13.6 L32.3 15.8 L30.0 17.6 L27.5 18.8 L24.1 19.7 L21.6 19.7 L16.5 19.3 L13.7 19.8 L11.2 20.8 L9.4 22.0 L7.5 23.8 L6.3 25.4 L5.1 27.9 L4.4 30.5 L4.3 33.0 L4.6 35.3 L5.2 37.2 L6.4 39.4 L9.5 43.0 L11.3 46.0 L12.3 48.9 L12.5 52.2 L12.0 54.8 L10.9 57.5 L9.8 59.3 L7.7 61.8 L6.2 64.6 L5.4 67.4 L5.3 70.2 L5.9 73.2 L7.0 75.9 L8.7 78.1 L11.3 80.4 L14.0 81.7 L16.6 82.4 L19.5 82.5 L23.1 81.8 L25.9 81.7 L28.9 82.3 L31.0 83.1 L34.0 84.9 L36.3 87.2 L37.7 89.3 L39.8 93.9 L41.2 95.7 L42.6 97.1 L44.5 98.3 L47.1 99.4 L49.3 99.9 L51.6 100.0 L53.9 99.7 L56.1 99.0 L58.3 97.8 L60.0 96.6 L62.5 93.4 L64.4 88.7 L65.6 86.5 L68.0 83.9 L69.8 82.5 L72.4 81.2 L75.2 80.5 L78.7 80.3 L83.2 80.7 L86.5 80.1 L88.9 79.1 L90.6 78.0 L92.4 76.3 L93.6 74.7 L94.8 72.2 L95.5 70.0 L95.7 66.9 L95.4 64.6 L94.7 62.6 L93.7 60.7 L90.2 56.6 L88.7 54.2 L87.7 50.8 L87.5 47.6 L88.0 44.9 L88.9 42.6 L90.2 40.6 L92.4 37.8 L93.5 35.8 L94.4 32.9 L94.6 30.0 L94.2 27.2 L93.0 24.3 L91.3 21.8 L88.9 19.7 L85.9 18.3 L83.0 17.6 L80.5 17.5 L77.3 18.1 L74.7 18.3 L71.8 17.9 L68.9 16.9 L66.0 15.1 L63.8 13.0 L62.2 10.5 L60.0 5.9 L58.8 4.4 L57.3 2.9 L55.3 1.6 L53.1 0.6 L50.6 0.1ZM48.3 26.1 L52.5 26.2 L56.9 27.1 L61.4 29.0 L65.6 31.8 L68.8 35.1 L71.4 39.3 L73.1 43.7 L73.9 48.4 L73.8 53.0 L72.6 58.0 L70.6 62.2 L68.0 65.8 L64.8 68.8 L61.4 71.0 L57.0 72.9 L52.0 73.8 L47.3 73.8 L42.7 72.8 L38.4 70.9 L34.6 68.4 L31.4 65.1 L28.8 61.2 L26.9 56.7 L26.0 51.8 L26.2 47.0 L27.3 42.1 L29.2 38.0 L31.9 34.2 L35.2 31.1 L39.6 28.4 L43.7 26.9Z" fill="#7B33EA" fill-rule="evenodd" transform="translate(284 97) scale(0.22)"></path><text x="314" y="113" font-weight="600" fill="#1a1a1a">agentshield</text></g><g><rect x="284" y="128" width="436" height="72" rx="8" fill="none" fill-opacity="1" stroke="#c3c3ba" stroke-width="1.25"></rect><text x="300" y="152" font-weight="600" fill="#1a1a1a">One evidence graph</text><text x="300" y="168" font-size="11.5" fill="#5f5f5a">Workloads, identities, policies, routes and observed traffic</text><text x="300" y="184" font-size="11.5" fill="#5f5f5a">Every fact records the plugin and observation behind it</text></g><g><rect x="284" y="224" width="436" height="72" rx="8" fill="none" fill-opacity="1" stroke="#c3c3ba" stroke-width="1.25"></rect><text x="300" y="248" font-weight="600" fill="#1a1a1a">Detect risky changes</text><text x="300" y="264" font-size="11.5" fill="#5f5f5a">New exposure, lost governance, changed policy, new RBAC bindings</text><text x="300" y="280" font-size="11.5" fill="#5f5f5a">and workloads reaching places they never reached before</text></g><g><rect x="284" y="320" width="436" height="72" rx="8" fill="none" fill-opacity="1" stroke="#c3c3ba" stroke-width="1.25"></rect><text x="300" y="344" font-weight="600" fill="#1a1a1a">Investigate with evidence</text><text x="300" y="360" font-size="11.5" fill="#5f5f5a">An opt-in model examines each signal with read-only graph tools</text><text x="300" y="376" font-size="11.5" fill="#5f5f5a">A finding counts only if it cites facts the graph returned</text></g><g><rect x="284" y="416" width="436" height="72" rx="8" fill="#7B33EA" fill-opacity="0.12" stroke="#7B33EA" stroke-width="2"></rect><text x="300" y="440" font-weight="600" fill="#1a1a1a">Propose a fix, and a person approves it</text><text x="300" y="456" font-size="11.5" fill="#1a1a1a">A NetworkPolicy, CiliumNetworkPolicy or STRICT PeerAuthentication</text><text x="300" y="472" font-size="11.5" fill="#1a1a1a">is dry-run first; nothing changes until someone says yes</text></g><g><rect x="284" y="512" width="436" height="72" rx="8" fill="none" fill-opacity="1" stroke="#c3c3ba" stroke-width="1.25"></rect><text x="300" y="536" font-weight="600" fill="#1a1a1a">Apply and verify</text><text x="300" y="552" font-size="11.5" fill="#5f5f5a">The approved change lands in your cluster</text><text x="300" y="568" font-size="11.5" fill="#5f5f5a">and agentshield confirms it took effect</text></g><g fill="none" stroke="#c3c3ba" stroke-width="1.25"><path d="M252 164H282" marker-end="url(#how-arrow)"></path><path d="M502 200V222" marker-end="url(#how-arrow)"></path><path d="M502 296V318" marker-end="url(#how-arrow)"></path><path d="M502 392V414" marker-end="url(#how-arrow)"></path><path d="M502 488V510" marker-end="url(#how-arrow)"></path><path d="M284 548H254" marker-end="url(#how-arrow)"></path></g></svg>